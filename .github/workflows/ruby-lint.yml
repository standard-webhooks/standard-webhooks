name: Ruby Lint

on:
  pull_request:
    paths:
      - "libraries/ruby/**"
      - ".github/workflows/ruby-lint.yml"

jobs:
  build:
    name: Ruby Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Use a minor series (not .ruby-version's exact patch) so CI always
          # gets the latest prebuilt 3.4.x; newer runner images drop old patches.
          ruby-version: "3.4"
          working-directory: libraries/ruby

      - name: Install dependencies
        run: |
          bundler install
        working-directory: libraries/ruby

      - name: Build
        run: |
          bundler exec rake build
        working-directory: libraries/ruby
