name: Elixir Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write

jobs:
  build:
    name: Elixir Release
    runs-on: ubuntu-latest
    environment: Release

    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          version-type: strict
          version-file: libraries/elixir/.tool-versions

      - name: Install dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
        working-directory: libraries/elixir

      - name: Build
        run: |
          mix compile
        working-directory: libraries/elixir

      # https://hex.pm/docs/publish#publishing-from-ci
      - name: Publish package to hex.pm
        run: |
          mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        working-directory: libraries/elixir
