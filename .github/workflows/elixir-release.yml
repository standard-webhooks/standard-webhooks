name: Elixir Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write

jobs:
  build:
    name: Elixir Release
    runs-on: ubuntu-latest
    environment: Release

    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs Hex >= 2.6 (installed by `mix local.hex`
      # below) running on OTP >= 27, so this doesn't use .tool-versions.
      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Install dependencies
        run: |
          mix local.rebar --force
          mix local.hex --force
          mix deps.get
        working-directory: libraries/elixir

      - name: Build
        run: |
          mix compile
        working-directory: libraries/elixir

      # Trusted publishing: with no HEX_API_KEY set, Hex exchanges the GitHub
      # OIDC token for a short-lived token that can only publish this package.
      - name: Publish package to hex.pm
        run: |
          mix hex.publish --yes
        working-directory: libraries/elixir
