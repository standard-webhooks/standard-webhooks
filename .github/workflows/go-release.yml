name: Go Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tag:
    name: Go Release
    runs-on: ubuntu-latest
    environment: Release

    steps:
      - uses: actions/checkout@v7

      # The Go module lives in libraries/ (module path
      # github.com/standard-webhooks/standard-webhooks/libraries), so Go
      # resolves its versions from tags prefixed with "libraries/".
      - name: Push Go module tag
        run: |
          git tag "libraries/${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          git push origin "libraries/${GITHUB_REF_NAME}"

      - name: Warm the Go module proxy
        run: |
          curl -sSf "https://proxy.golang.org/github.com/standard-webhooks/standard-webhooks/libraries/@v/${GITHUB_REF_NAME}.info"
